[build]
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Voice stack APIs (per-function redirects, never a wildcard /api/*).
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP is scoped to exactly what this site loads:
# Google Fonts (styles+fonts), the Manus CDN (photos + hero video), ESPN
# team logos, and the Google Maps embed on /contact. 'unsafe-inline' in
# style-src is required by React inline style attributes. microphone=(self)
# keeps the chat widget's voice input working.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    # umami + credit.js arrive via Netlify snippet injection (ALM Hub), not the repo.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://umami-production-8669.up.railway.app https://adamloomismarketing.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://a.espncdn.com; media-src 'self'; frame-src https://www.google.com; connect-src 'self' https://umami-production-8669.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Hashed build assets never change; cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/narration/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
